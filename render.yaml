services:
  - type: web
    name: attendance-backend
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_DRIVER_CLASS_NAME
        sync: false
      - key: DB_DIALECT
        sync: false
      - key: SESSION_COOKIE_SECURE
        value: "true"
